name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/document-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  dotnet-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null && \
               curl -fsS http://localhost:8080/health >/dev/null && \
               curl -fsS http://localhost:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Create a synthetic invoice and verify the end-to-end flow
        run: |
          python -m pip install reportlab
          python - <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import letter

          path = "sample-invoice.pdf"
          pdf = canvas.Canvas(path, pagesize=letter)
          text = pdf.beginText(50, 740)
          for line in [
              "Supplier: ACME Supplies Ltd",
              "Invoice Number: INV-2026-0042",
              "Issue Date: 11/11/2026",
              "Total: R$ 1.234,56",
          ]:
              text.textLine(line)
          pdf.drawText(text)
          pdf.save()
          PY

          curl --fail --silent --show-error \
            -F "file=@sample-invoice.pdf;type=application/pdf" \
            http://localhost:3000/api/documents > response.json

          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("response.json").read_text())
          assert response["status"] == "Completed", response
          extracted = json.loads(response["extractedDataJson"])
          assert extracted["document_type"] == "invoice", extracted
          fields = extracted["fields"]
          assert fields["supplier"] == "ACME Supplies Ltd", fields
          assert fields["invoice_number"] == "INV-2026-0042", fields
          assert fields["total"] == "1.234,56", fields
          assert fields["currency"] == "BRL", fields
          print("End-to-end upload, PDF extraction, persistence and API response passed.")
          PY
      - name: Stop the stack
        if: always()
        run: docker compose down -v
